
# Builds the Windows installer and publishes it as a GitHub Release when a version tag is pushed.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write   # lets the job create the release and upload the installer
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true   # shows known vulnerabilities in the log without blocking the build
      - name: Check the version and write the release notes
        shell: bash
        run: |
          node -e "
          const v = require('./package.json').version, r = require('./renderer/releases.js')[0], tag = (process.env.GITHUB_REF_NAME || '').replace(/^v/, '');
          if (tag.match(/^\d/) && tag !== v) throw new Error('The tag says ' + tag + ' but package.json says ' + v);
          if (!r || r.v !== v) throw new Error('renderer/releases.js has no notes for ' + v + ' yet: add them at the top');
          require('fs').writeFileSync('build/release-notes.md', r.items.map(([t, b]) => '- **' + t + '.** ' + b).join('\n') + '\n');
          console.log('Release notes for', v, 'written');"
      - name: Build and publish the installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
